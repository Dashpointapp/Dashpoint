<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=3.0">

    <title>Dashpoint 3.0</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f6fa;
            color: #202124;
        }

        .container {
            max-width: 750px;
            margin: 80px auto;
            padding: 40px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #1a73e8;
        }

        .subtitle {
            font-size: 18px;
            color: #5f6368;
            margin-bottom: 35px;
        }

        .download {
            display: inline-block;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 16px 30px;
            border-radius: 9px;
            margin: 20px 0;
        }

        .download:hover {
            background: #1558b0;
        }

        .features {
            margin: 35px auto;
            max-width: 420px;
            text-align: left;
            line-height: 2;
        }

        .version {
            margin-top: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Dashpoint</h1>

        <div class="subtitle">
            Jednoduchá aplikace pro Windows, pomocník při práci.
        </div>

        <div class="features">
            ✓ Výpočty DPH, procent atd...<br>
            ✓ Převody měn podle kurzů ČNB<br>
            ✓ Aktuální ceny zlata<br>
            ✓ Aktuální počasí<br>
            ✓ Světlý a tmavý režim
        </div>

        <a class="download" href="https://github.com/Dashpointapp/Dashpoint/releases/download/v3.0/Dashpoint_Setup.exe">
            Stáhnout pro Windows
        </a>

        <div class="version">
            Windows 10 / 11<br>
            Verze 3.0
        </div>

    </div>

</div>

</body>
</html>
